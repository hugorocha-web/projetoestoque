<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <header>
        <i class="fa-solid fa-box"></i>
        <h1>Estoque De Produtos</h1>

    </header>
    <main>
        <section id="resumos">
            <div id="bemvindo">
                <h1>Bem Vindo!</h1>
                <p>Aqui está um resumo do estoque.</p>
            </div>
            <div id="res">
                <div  class="itensre">
                    <i class="fa-solid fa-box"></i>
                    <div>
                        <p>Total de Produtos</p>
                        <h2>12</h2>
                    </div>
                </div>
                <div class="itensre">
                    <i class="fa-solid fa-layer-group"></i>
                    <div>
                        <p>Categorias</p>
                        <h2>12</h2>
                    </div>
                </div>
                <div class="itensre">
                    <i class="fa-solid fa-list"></i>
                    <div>
                        <p>Itens em Estoque</p>
                        <h2>12</h2>
                    </div>
                </div>

            </div>
            <div id="ult">
                <h2>Ultimos Produtos</h2>
                <div>
                    <p>ver todos</p>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </div>
            </div>
        </section>
        <section id="sectionProdutos">
            <div id="produto">
                <img src="images (1).jpg" alt="">
                <div>
                    <h1 id="titulopro">Fone de ouvido Bluetooth</h1>
                    <p id="categoriapro">Eletrónicos</p>
                    <h2 id="precopro">R$ 199,90</h2>
                    <div id="sa">
                        <div>
                            <i class="fa-solid fa-money-bill-trend-up"></i>
                            <p id="situacaopro">em estoque</p>
                        </div>
                        <p id="estoquepro">15</p>
                    </div>

                </div>
            </div>
        </section>
    </main>
    <footer>
        <div id="a1">
            <i class="fa-solid fa-house"></i>
            <p>Inicio</p>
        </div>
        <div id="a2">
            <i class="fa-solid fa-boxes-stacked"></i>
            <p>Produtos</p>
        </div>
        <i class="fa-solid fa-plus"></i>
        <div id="a3">
            <i class="fa-solid fa-layer-group"></i>
            <p>Categorias</p>
        </div>
        <div id="a4">
            <a href="https://github.com/hugorocha-web" target="_blank">
                <i class="fa-brands fa-github"></i>
                <p>GitHub</p>
            </a>
        </div>
    </footer>
    <script src="main.js"></script>
</body>
</html>
